name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

# Least privilege: jobs receive read-only repo access unless they escalate.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Check go.mod/go.sum are tidy and in sync
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -u go.mod.bak go.mod >/dev/null || ! diff -u go.sum.bak go.sum >/dev/null; then
            echo "::error::go.mod or go.sum is out of date. Run 'go mod tidy' and commit the result."
            diff -u go.mod.bak go.mod || true
            diff -u go.sum.bak go.sum || true
            exit 1
          fi
      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -s -l .
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    name: Test (race + coverage)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Run go vet
        run: go vet ./...
      - name: Run tests with race detection and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      # Coverage is only collected once (Linux) to avoid duplicate uploads.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  vulnscan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build-check:
    name: Build verification (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test]
    # Verify cross-platform compilation on every PR so platform regressions
    # surface before tagging, not at release time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/ghostmail

  release-build:
    name: Release artifacts
    needs: [lint, test, vulnscan, build-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Keyless signing requires OIDC token issuance.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build reproducible artifacts for all platforms
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH from the tagged commit makes the embedded build
          # date deterministic, so two builds of the same tag are byte-identical.
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist
          build_one() {
            local goos="$1" goarch="$2" ext="$3"
            local out="dist/ghostmail-${goos}-${goarch}${ext}"
            echo "Building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" ./cmd/ghostmail
          }
          build_one linux   amd64 ""
          build_one linux   arm64 ""
          build_one darwin  amd64 ""
          build_one darwin  arm64 ""
          build_one windows amd64 ".exe"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (keyless, OIDC)
        run: |
          set -euo pipefail
          # Keyless signing issues a short-lived certificate via the workflow's
          # OIDC identity; the .sig + .pem pairs let anyone verify provenance with
          # `cosign verify-blob --certificate-identity ... --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
          for bin in dist/ghostmail-*; do
            cosign sign-blob --yes \
              --output-signature "${bin}.sig" \
              --output-certificate "${bin}.pem" \
              "${bin}"
          done

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum ghostmail-* > ghostmail-checksums.txt
          cat ghostmail-checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: ghostmail-sbom.spdx.json
          format: spdx-json
          output-file: dist/ghostmail-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/

  release:
    name: Publish release
    needs: release-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: |
            artifacts/ghostmail-*
            artifacts/ghostmail-checksums.txt
            artifacts/ghostmail-sbom.spdx.json
          generate_release_notes: true
          body: |
            ## Verifying the release

            Each binary is signed with **sigstore** keyless signing (OIDC).

            ```bash
            # Verify a binary's signature
            cosign verify-blob \
              --certificate ghostmail-linux-amd64.pem \
              --signature ghostmail-linux-amd64.sig \
              --certificate-identity https://github.com/GodGMN/ghostmail-cli/.github/workflows/ci.yml@refs/tags/${{ github.ref_name }} \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghostmail-linux-amd64

            # Verify the download integrity
            sha256sum -c ghostmail-checksums.txt --ignore-missing
            ```

            A Software Bill of Materials (`ghostmail-sbom.spdx.json`) is attached.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
